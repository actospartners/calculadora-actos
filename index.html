<style>
/* Layout: mesmo esqueleto da página de referência (hero escuro com ilustração à direita, formulário em faixa escura com 4 campos, cards escalonados, "sobre" com foto, botões de chamada) na paleta Actos: verde → verde luz, menta, branco private, sálvia. Look único e claro de propósito. */
:root{
  --verde:#1B3A32; --luz:#2A6C58; --menta:#D6E8D6; --papel:#F2EFE8; --noite:#10241F; --salvia:#B9C9B8; --brilho:#06E8D6;
  --f:"Jost","Futura","Century Gothic",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#F2EFE8;color:var(--noite);font-family:var(--f);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow-x:hidden}
:focus-visible{outline:3px solid var(--brilho);outline-offset:2px}
a{color:inherit}
.full{margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1080px;margin:0 auto;position:relative;z-index:1}

/* HERO */
.hero{position:sticky;top:0;z-index:0;min-height:660px;overflow:hidden;color:#fff;padding-top:env(safe-area-inset-top,0px);padding-bottom:80px;
  background:
   radial-gradient(48% 80% at 79% 58%,rgba(6,232,214,.85) 0%,rgba(6,232,214,0) 68%),
   radial-gradient(70% 90% at 100% 100%,#27b08f 0%,rgba(39,176,143,0) 62%),
   radial-gradient(55% 70% at 0% 0%,#34987a 0%,rgba(52,152,122,0) 62%),
   linear-gradient(115deg,#0a2a23 0%,#124a3b 42%,#1a7b63 100%)}
.wave{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
.data{position:absolute;inset:0;pointer-events:none;font-family:var(--mono);color:#9ff5e6;opacity:.16;overflow:hidden;filter:blur(.6px)}
.data span{position:absolute;white-space:nowrap}
.floor{position:absolute;right:2%;bottom:-40px;width:min(640px,55vw);height:150px;background:radial-gradient(50% 50% at 50% 50%,rgba(2,14,11,.95),rgba(2,14,11,0) 72%);filter:blur(14px);pointer-events:none}
.top{padding:26px 0 0}
.badge{display:inline-block;margin-top:70px;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#fff;
  background:linear-gradient(180deg,#19c9ae,#0e8f7b);border:1.5px solid #9ff5e6;padding:9px 18px;border-radius:4px;box-shadow:0 0 22px rgba(6,232,214,.55)}
.hero h1{margin:22px 0 0;font-size:clamp(34px,5.4vw,58px);line-height:1.02;font-weight:800;text-transform:uppercase;letter-spacing:.005em;max-width:12.5em}
.hero h1{text-shadow:0 4px 30px rgba(0,0,0,.35)}
.hero h1 b{color:#38f2dc;font-weight:800;text-shadow:0 0 28px rgba(6,232,214,.65)}
.hero p{max-width:30em;font-size:18px;margin:24px 0 0;color:#e6f2e6;font-weight:400}
.man{position:absolute;right:max(0px,calc(50% - 560px));bottom:0;height:calc(100% - 10px);max-height:780px;width:auto;pointer-events:none;filter:drop-shadow(0 0 22px rgba(6,232,214,.55)) drop-shadow(0 0 70px rgba(6,232,214,.35))}

/* LIGHT BODY */
.body{position:relative;z-index:2;margin-top:-1px;overflow:clip;border-radius:22px 22px 0 0;padding-top:120px;
  background:
   radial-gradient(40% 30% at 8% 6%,rgba(185,201,184,.75),rgba(185,201,184,0) 70%),
   radial-gradient(50% 40% at 95% 70%,rgba(214,232,214,.9),rgba(214,232,214,0) 70%),
   linear-gradient(180deg,#e4ece2 0,#F2EFE8 38%,#F2EFE8 100%);
  padding-bottom:30px}
.arc{position:absolute;left:-14%;top:30px;width:60%;aspect-ratio:1;border:1.5px solid rgba(255,255,255,.9);border-radius:50%;pointer-events:none}
.wmw{position:sticky;top:0;height:0;z-index:0;pointer-events:none}.wm{position:absolute;right:-40px;top:14vh;width:min(560px,62vw)}

/* FORM */
.form{position:relative;margin-top:0;z-index:3;border-radius:14px;padding:40px 44px 44px;
  background:linear-gradient(135deg,#10241F,#1B3A32);box-shadow:0 26px 50px -24px rgba(16,36,31,.8);border:1px solid rgba(214,232,214,.14)}
.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.form label{display:block;color:#fff;font-weight:700;font-size:15px;margin-bottom:6px}
.form input[type=text],.form input[type=email],.form input[type=tel],.form select{width:100%;height:48px;font:inherit;font-size:17px;padding:0 14px;border:0;border-radius:6px;background:#fff;color:#10241F}
.phone{display:flex;background:#fff;border-radius:6px;align-items:center;height:48px}
.phone svg{margin:0 6px 0 12px;flex:none}
.phone input{height:48px!important;padding-left:4px!important;background:transparent!important}
.go{display:flex;margin:22px auto 0;align-items:center;justify-content:center;gap:12px;width:min(620px,100%);min-height:64px;padding:10px 18px;cursor:pointer;
  font:800 22px/1.15 var(--f);letter-spacing:.02em;text-transform:uppercase;color:#10241F;border:0;border-radius:10px;
  background:#06E8D6;box-shadow:0 10px 26px -10px rgba(6,232,214,.8)}
.go:hover{filter:brightness(1.05)}
.pl{font-size:.8em}
.err{color:#ffd9a8;text-align:center;margin:10px 0 0;min-height:1.2em;font-size:15px}
.hp{position:absolute;left:-9999px;opacity:0}

/* EXPLAIN */
.sec{text-align:center;padding-top:84px}
.form+.sec{padding-top:140px}
.eyebrow{color:var(--luz);font-weight:500;letter-spacing:.04em;text-transform:uppercase;font-size:16px}
.sec h2{font-size:clamp(26px,3.6vw,36px);font-weight:700;line-height:1.2;max-width:19em;margin:8px auto 22px}
.sec p.t{max-width:42em;margin:0 auto;font-size:16.5px}
.sec p.t b{font-weight:700}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px;margin-top:56px;align-items:start;text-align:left}
.card{background:rgba(255,255,255,.72);backdrop-filter:blur(6px);border:1px solid rgba(42,108,88,.28);border-radius:14px;padding:26px 28px 30px;box-shadow:0 14px 30px -22px rgba(16,36,31,.5)}
.card:nth-child(1){margin-top:50px}.card:nth-child(2){margin-top:25px}
.card svg{display:block;width:104px;height:84px;margin-bottom:20px}
.card h3{margin:0 0 10px;font-size:20px;font-weight:700}
.card h3 i{display:inline-block;width:7px;height:7px;background:var(--brilho);margin:0 6px 3px 2px;border:1px solid var(--luz)}
.card p{margin:0;color:#4d6159;font-size:16px}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:12px;margin-top:52px;min-height:60px;padding:10px 34px;text-decoration:none;cursor:pointer;
  font:800 21px/1.15 var(--f);letter-spacing:.02em;text-transform:uppercase;color:#fff;border:2px solid #06E8D6;border-radius:6px;
  background:#1B3A32;box-shadow:0 12px 26px -12px rgba(16,36,31,.7)}
.sobre{padding-top:74px}
.sobre .eyebrow{letter-spacing:.3em}
.photo{width:min(456px,100%);aspect-ratio:5/4;margin:26px auto 0;border-radius:18px;overflow:hidden;position:relative;
  background:radial-gradient(90% 90% at 80% 100%,#2A6C58,#1B3A32 60%,#10241F);display:grid;place-items:center;box-shadow:0 20px 36px -24px rgba(16,36,31,.7)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .ph{text-align:center;color:var(--menta)}
.photo .ph small{display:block;margin-top:8px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--salvia)}
.sobre p.m{max-width:36em;margin:28px auto 0;font-weight:700;font-size:16.5px}
footer{position:relative;z-index:2;margin-top:70px;padding-top:34px;padding-bottom:calc(34px + env(safe-area-inset-bottom,0px));background:#10241F;color:#B9C9B8;font-size:13.5px;text-align:center}
footer p{max-width:78ch;margin:14px auto 0}
.close{position:relative;z-index:2;text-align:center;color:#fff;padding-top:84px;padding-bottom:calc(46px + env(safe-area-inset-bottom,0px));margin-top:0;overflow:clip;
  background:repeating-linear-gradient(62deg,rgba(159,245,230,.06) 0 46px,rgba(159,245,230,0) 46px 120px),repeating-linear-gradient(-28deg,rgba(159,245,230,.05) 0 30px,rgba(159,245,230,0) 30px 150px),
   radial-gradient(60% 100% at 0% 25%,rgba(6,232,214,.55),rgba(6,232,214,0) 70%),radial-gradient(50% 80% at 100% 100%,#27b08f,rgba(39,176,143,0) 65%),linear-gradient(120deg,#0a2a23 0%,#124a3b 50%,#1a7b63 100%)}
.close h2{font-size:clamp(28px,4.4vw,44px);font-weight:700;line-height:1.15;max-width:18em;margin:0 auto;text-shadow:0 4px 24px rgba(0,0,0,.35)}
.close .cta{margin-top:36px;background:linear-gradient(180deg,#19c9ae,#0e8f7b);border-color:#9ff5e6;box-shadow:0 0 28px rgba(6,232,214,.55);min-width:min(420px,100%)}
.close .cp{margin:60px 0 0;font-size:14px;color:#cfeee6}
.close .lg2{max-width:80ch;margin:14px auto 0;font-size:12.5px;color:#a9d8cc}

/* OBRIGADO */
.thx{position:relative;overflow:hidden;color:#fff;text-align:center;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:60px;
  background:radial-gradient(60% 50% at 100% 0%,rgba(6,232,214,.3),rgba(6,232,214,0) 70%),radial-gradient(90% 120% at 100% 100%,#2A6C58 0%,#1B3A32 55%,#10241F 100%)}

.vid{width:min(930px,100%);aspect-ratio:16/9;margin:40px auto 0;background:linear-gradient(135deg,#10241F,#1B3A32);border:1px solid rgba(214,232,214,.25);display:grid;place-items:center;position:relative}
.vid .big{width:92px;height:62px;border-radius:16px;background:#e3342f;display:grid;place-items:center;margin:0 auto 14px}
.vid .big::after{content:"";border-left:22px solid #fff;border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:5px}
.vid small{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--salvia)}
.wa{display:inline-block;margin-top:46px;background:#0fae2a;color:#fff;font-weight:600;font-size:22px;padding:18px 54px;border-radius:8px;text-decoration:none;text-transform:uppercase}
.wa.pulse{animation:pls 1.1s ease-in-out 4}
@keyframes pls{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(15,174,42,.6)}50%{transform:scale(1.05);box-shadow:0 0 0 16px rgba(15,174,42,0)}}
.thx .after{margin-top:46px;font-size:19px;line-height:1.9}

/* CALCULADORA */
.hd{position:relative;overflow:hidden;color:#fff;padding-top:env(safe-area-inset-top,0px);padding-bottom:110px;

.hd h1{font-size:clamp(30px,4.6vw,50px);font-weight:800;text-transform:uppercase;line-height:1.05;max-width:15em;margin:46px 0 0}
.hd p{max-width:36em;color:#e6f2e6;font-size:18px;margin:16px 0 0}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px;margin-top:-80px;position:relative;z-index:3;align-items:start}
.pn{background:#fff;border:1px solid rgba(42,108,88,.25);border-radius:14px;padding:26px;box-shadow:0 18px 34px -24px rgba(16,36,31,.6)}
.pn.dk{background:linear-gradient(135deg,#10241F,#1B3A32);color:#fff;border:0}
.pn label{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.pn input[type=number]{width:100%;height:48px;font:inherit;font-size:19px;padding:0 14px;border:1px solid #cfd8cc;border-radius:6px;background:#F2EFE8;color:#10241F;font-variant-numeric:tabular-nums}
.pn .f{margin-bottom:16px}
.res{display:grid;gap:16px}
.tag{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--luz)}
.dk .tag{color:var(--brilho)}
.bg{font-family:var(--mono);font-size:clamp(30px,4.4vw,44px);font-weight:500;margin-top:8px;line-height:1.1;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.kv div{border-top:1px solid rgba(127,154,134,.45);padding-top:8px;font-size:14px}
.kv b{display:block;font-family:var(--mono);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums}
.nt{font-size:14px;color:#5c6f66;margin:12px 0 0}.dk .nt{color:#b9c9b8}
.paths{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.path{border:1px solid rgba(42,108,88,.28);border-radius:10px;padding:14px;background:#F2EFE8}
.path b{display:block;font-weight:700}.path span{font-size:15px;color:#4d6159}
.lg{max-width:80ch;margin:26px auto 0;font-size:13.5px;color:#5c6f66}

@media (max-width:860px){
  .row,.cards,.calc,.paths,.kv{grid-template-columns:1fr}
  .card:nth-child(n){margin-top:0}
  .hero{position:relative;display:flex;flex-direction:column;min-height:0;padding-bottom:0}
  .hero .in{order:1;width:100%}
  .man{position:relative;order:2;right:auto;bottom:auto;height:auto;max-height:none;width:min(78%,330px);margin:10px auto 0}
  .badge{margin-top:34px}.hero p{font-size:17px}
  .cta{font-size:18px;padding:10px 20px;width:100%;max-width:440px}.go{font-size:18px}
  .form+.sec{padding-top:72px}.sec{padding-top:56px}
  .thx h1{margin-top:36px}.thx p.l{font-size:17px;line-height:1.7}.wa{padding:16px 28px;font-size:18px}
  .form{padding:24px 18px 32px}
  .body{padding-top:64px}.go{font-size:18px}
  .wm{opacity:.7}
}
@media (prefers-reduced-motion:no-preference){.go,.cta,.wa{transition:filter .15s,transform .15s}.go:hover,.cta:hover,.wa:hover{transform:translateY(-1px)}}
</style>

</head>

 '<div class="card">'+IC2+'<h3><i></i>2 · Assista ao vídeo</h3><p>Após isso, você será imediatamente direcionado para uma página com um vídeo de 1 minuto, te explicando como usar a calculadora.</p></div>'+
 '<div class="card">'+IC3+'<h3><i></i>3 · Agora é só usar</h3><p>Então, ao clicar em 1 botão, você estará em nossa calculadora. Basta digitar o valor de parcela que você pode pagar por mês e descubra caminhos para construir patrimônio.</p></div></div>'+
 '<a class="cta" href="#topo" onclick="goForm();return false"><span class="pl">▶</span>Acessar calculadora</a></div>'+
 '<div class="sec sobre"><div class="eyebrow">Sobre</div><h2>Conheça a Actos Partners e a nossa equipe de sócios</h2>'+
 '<p class="m" style="margin-top:22px">Muito prazer, nós somos a Actos Partners. Nossa missão é ajudar famílias que já construíram patrimônio a fazê-lo trabalhar, com plano, clareza e independência. Os sócios saíram de lugares onde o discurso e a prática não batiam, e por isso explicamos como somos remunerados antes de qualquer conversa. Do plano ao ato.</p>'+
 '<a class="cta" href="#topo" onclick="goForm();return false"><span class="pl">▶</span>Quero usar a calculadora</a></div></div></div>'+closeBand();

 if(CONFIG.VIDEO_MP4)return '<div class="vid"><video id="vv" src="'+CONFIG.VIDEO_MP4+'" controls playsinline preload="metadata" style="width:100%;height:100%;display:block;background:#000"></video></div>';
 if(CONFIG.VIDEO_YOUTUBE_ID)return '<div class="vid"><iframe src="https://www.youtube.com/embed/'+CONFIG.VIDEO_YOUTUBE_ID+'?rel=0&modestbranding=1" title="Como usar a calculadora" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen style="width:100%;height:100%;border:0"></iframe></div>';

function viewThanks(){
 return '<div class="thx full">'+WAVE+'<div class="in"><div class="top" style="padding-top:26px">'+logo(170)+'</div>'+
 '<h1>Cadastro confirmado: calculadora liberada!</h1>'+
 '<p class="l">Assista ao vídeo de 1 minuto. Ele mostra como usar a calculadora de alavancagem imobiliária. Depois, clique no botão verde, entre no nosso grupo e faça a sua primeira simulação!</p>'+

 '<a class="wa" href="'+CONFIG.WHATS_GRUPO+'" target="_blank" rel="noopener">Acessar grupo WhatsApp</a>'+

function viewCalc(){
 return '<div class="hd full">'+WAVE+'<div class="in"><div class="top" style="padding-top:26px">'+logo(170)+'</div>'+
 '<h1>Calculadora de alavancagem imobiliária</h1><p>Digite a parcela mensal que cabe no seu bolso. O resultado aparece na hora.</p></div></div>'+
 '<div class="body full" style="padding-top:0">'+WM+'<div class="in"><div class="calc"><div class="pn">'+
 '<div class="f"><label for="v">Valor do imóvel (R$)</label><input id="v" type="number" inputmode="numeric" value="1000000" min="0" step="10000"></div>'+
 '<div class="f"><label for="a">Aluguel mensal atual (R$)</label><input id="a" type="number" inputmode="numeric" value="4500" min="0" step="100"></div>'+
 '<div class="f"><label for="p">Parcela mensal que cabe no bolso (R$)</label><input id="p" type="number" inputmode="numeric" value="'+(LEAD.parcela||3000)+'" min="0" step="100"></div>'+
 '<p class="nt" style="margin:0">Exemplo preenchido. Troque pelos seus números.</p></div><div class="res" id="res"></div></div>'+
 '<p class="lg">'+LEGAL+'</p></div></div>'+foot();
}
function calc(){
 var v=+document.getElementById("v").value||0,a=+document.getElementById("a").value||0,p=+document.getElementById("p").value||0,T=CONFIG.TABELA;
 var am=v>0?a/v*100:0,aa=am*12,fator=(1+T.taxaTotal)/T.prazo,cred=p>0?Math.floor(p/fator/T.passo)*T.passo:0;
 if(cred>T.max)cred=T.max;var ok=cred>=T.min,parc=cred*fator,ratio=v>0?cred/v*100:0;
 var o='<div class="pn dk"><span class="tag">1 · O que o imóvel rende hoje</span><div class="bg">'+pct(am)+' ao mês</div><div class="kv"><div>Aluguel por ano<b>'+brl(a*12)+'</b></div><div>Rendimento anual bruto<b>'+pct(aa)+'</b></div><div>Valor do imóvel<b>'+brl(v)+'</b></div></div><p class="nt">Antes de impostos, vacância e custos. Imóvel de alto valor com aluguel baixo é patrimônio grande com pouca liquidez.</p></div>';
 if(ok){
  o+='<div class="pn"><span class="tag">2 · Liquidez que pode ser criada</span><div class="bg">'+brl(cred)+'</div><div class="kv"><div>Parcela mensal<b>'+brl(parc)+'</b></div><div>Prazo<b>'+T.prazo+' meses</b></div><div>Equivale a<b>'+pct(ratio)+' do imóvel</b></div></div><p class="nt">Estimativa ilustrativa para o valor de parcela informado.</p></div>'+
  '<div class="pn"><span class="tag">3 · O que fazer com isso, sem vender o imóvel</span><div class="paths">'+
  '<div class="path"><b>Gerar nova renda</b><span>Comprar outro imóvel para locação e somar aluguéis.</span></div><div class="path"><b>Valorizar o que você já tem</b><span>Reformar ou ampliar para subir valor e aluguel.</span></div>'+
  '<div class="path"><b>Ter caixa para oportunidade</b><span>Liquidez planejada para uma compra boa quando aparecer.</span></div><div class="path"><b>Trocar dívida cara</b><span>Reorganizar o que hoje pesa nos juros.</span></div></div>'+
  '<div style="text-align:center"><a class="cta" style="margin-top:22px;font-size:18px" href="'+CONFIG.WHATS_ESPECIALISTA+'" target="_blank" rel="noopener"><span class="pl">▶</span>Falar com um especialista</a></div></div>';
 } else o+='<div class="pn"><b>Aumente a parcela para ver a simulação.</b><p class="nt">A partir de '+brl(Math.ceil(T.min*fator))+' por mês.</p></div>';
 document.getElementById("res").innerHTML=o;
}
function route(){
 var h=location.hash.replace("#",""),app=document.getElementById("app");
 app.innerHTML=h==="obrigado"?viewThanks():h==="calculadora"?viewCalc():viewHome();
 if(h==="obrigado"||h==="calculadora"||h==="")window.scrollTo(0,0);
 if(h==="calculadora"){["v","a","p"].forEach(function(i){document.getElementById(i).addEventListener("input",calc)});calc()}
 var vv=document.getElementById("vv");
 if(vv)vv.addEventListener("ended",function(){var w=document.querySelector(".wa");if(w){w.classList.add("pulse");w.scrollIntoView({behavior:"smooth",block:"center"})}});
 var f=document.getElementById("lead");
 if(f)f.addEventListener("submit",function(e){
  e.preventDefault();
  var n=document.getElementById("nome").value.trim(),m=document.getElementById("email").value.trim(),t=document.getElementById("fone").value.replace(/\D/g,""),parc=document.getElementById("parc").value,err=document.getElementById("err");
  if(document.getElementById("site").value)return;
  if(n.length<2||!/^\S+@\S+\.\S+$/.test(m)||t.length<10||!parc){err.textContent="Confira nome, e-mail, telefone com DDD e quanto você investe por mês.";return}
  LEAD.parcela=+parc;
  err.textContent="";
  if(CONFIG.FORM_ENDPOINT){try{fetch(CONFIG.FORM_ENDPOINT,{method:"POST",mode:"no-cors",body:JSON.stringify({nome:n,email:m,whatsapp:t,parcela_mensal:parc,origem:"site-calculadora",quando:new Date().toISOString()})})}catch(x){}}
  location.hash="obrigado";
 });
}
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>

function num(v){return +String(v||"").replace(/\D/g,"")||0}
function fmtIn(el){var n=num(el.value);el.value=n?n.toLocaleString("pt-BR"):""}
function specialistUrl(r){var m="Fiz a simulação na calculadora da Actos. Parcela de "+brl(CALC.p)+", crédito de "+brl(r.credito)+(CALC.path>=0?". Tenho interesse em: "+PATHS[CALC.path].t:"")+". Quero falar com um especialista.";return CONFIG.WHATS_ESPECIALISTA.split("?")[0]+"?text="+encodeURIComponent(m)}
function renderCalc(){
 var r=creditFor(CALC.p),el=document.getElementById("res2"),T=CONFIG.TABELA,f=(1+T.taxaTotal)/T.prazo;
 if(!r){el.innerHTML='<div class="pn"><b class="biglab">Aumente um pouco a parcela para ver a simulação.</b><p class="nt">A simulação começa em '+brl(Math.ceil(T.min*f))+' por mês.</p></div>';return}
 var sobra=CALC.p-r.parcela;
 var h='<div class="pn dk"><span class="tag">Sua simulação Actos</span><div class="lab2">Crédito disponível na tabela</div><div class="bg" id="cnum">'+brl(CALC.shown||r.credito)+'</div>'+
 '<div class="kv"><div>Parcela mensal<b>'+brl(r.parcela)+'</b></div><div>Prazo<b>'+r.prazo+' meses</b></div><div>Do seu orçamento<b>sobram '+brl(sobra)+'</b></div></div>'+
 '<p class="ok2">Dentro do seu orçamento.</p></div>'+
 '<div class="pn"><span class="tag">E agora? 4 caminhos para usar esse crédito</span><p class="nt" style="margin:6px 0 12px">Escolha o que mais faz sentido para você. Sem precisar vender o imóvel.</p><div class="paths2">';
 PATHS.forEach(function(p,i){var on=CALC.path===i;h+='<button type="button" class="pth'+(on?' on':'')+'" data-path="'+i+'" aria-pressed="'+on+'"><b>'+p.t+'</b><span>'+(on?p.d:'Toque para ver como funciona')+'</span></button>'});
 h+='</div><div style="text-align:center"><a class="cta" style="margin-top:22px;font-size:18px;max-width:100%" href="'+specialistUrl(r)+'" target="_blank" rel="noopener"><span class="pl">▶</span>Falar com um especialista</a></div></div>';
 el.innerHTML=h;
 var cn=document.getElementById("cnum"),from=CALC.shown||0,to=r.credito;CALC.shown=to;
 if(cn&&from&&from!==to&&!window.matchMedia("(prefers-reduced-motion: reduce)").matches){var t0=null;(function st(ts){if(t0===null)t0=ts;var k=Math.min(1,(ts-t0)/450),e=1-Math.pow(1-k,3);cn.textContent=brl(from+(to-from)*e);if(k<1)requestAnimationFrame(st)})(performance.now())}
}
function renderRend(){var v=num(document.getElementById("iv").value),a=num(document.getElementById("ia").value),o=document.getElementById("rend");if(!v||!a){o.textContent="";return}var m=a/v*100;o.innerHTML="Rende <b>"+m.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+"% ao mês</b> ("+(m*12).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+"% ao ano, bruto, antes de impostos e vacância)."}
function initCalc(){
 CALC.p=LEAD.parcela||CALC.p;CALC.shown=0;var pv=document.getElementById("pv");pv.value=CALC.p.toLocaleString("pt-BR");
 var ch=document.getElementById("chips");[1000,1500,2000,3000,5000].forEach(function(v){var b=document.createElement("button");b.type="button";b.className="chip";b.dataset.v=v;b.textContent=brl(v);ch.appendChild(b)});
 function chipsOn(){[].forEach.call(ch.children,function(b){b.setAttribute("aria-pressed",String(+b.dataset.v===CALC.p))})}
 pv.addEventListener("input",function(){fmtIn(pv);CALC.p=num(pv.value);chipsOn();renderCalc()});
 ch.addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;CALC.p=+b.dataset.v;pv.value=CALC.p.toLocaleString("pt-BR");chipsOn();renderCalc()});
 document.getElementById("res2").addEventListener("click",function(e){var b=e.target.closest(".pth");if(!b)return;CALC.path=(CALC.path===+b.dataset.path)?-1:+b.dataset.path;renderCalc()});
 ["iv","ia"].forEach(function(id){var x=document.getElementById(id);x.addEventListener("input",function(){fmtIn(x);renderRend()})});
 chipsOn();renderCalc();
}
function route(){
 var h=location.hash.replace("#",""),app=document.getElementById("app");
 if(h==="calculadora"){location.replace("/calculadora/");return}
 app.innerHTML=h==="obrigado"?viewThanks():h==="calculadora"?viewCalc():viewHome();
 if(h==="obrigado"||h==="calculadora"||h==="")window.scrollTo(0,0);
 if(h==="calculadora")initCalc();
 var vv=document.getElementById("vv");
 if(vv)vv.addEventListener("ended",function(){var w=document.querySelector(".wa");if(w){w.classList.add("pulse");w.scrollIntoView({behavior:"smooth",block:"center"})}});
 var f=document.getElementById("lead");
 if(f)f.addEventListener("submit",function(e){
  e.preventDefault();
  var n=document.getElementById("nome").value.trim(),m=document.getElementById("email").value.trim(),t=document.getElementById("fone").value.replace(/\D/g,""),parc=document.getElementById("parc").value,err=document.getElementById("err");
  if(document.getElementById("site").value)return;
  if(n.length<2||!/^\S+@\S+\.\S+$/.test(m)||t.length<10||!parc){err.textContent="Confira nome, e-mail, telefone com DDD e quanto você investe por mês.";return}
  LEAD.parcela=+parc;try{if(window.fbq)fbq("track","Lead")}catch(e){}
  err.textContent="";
  if(CONFIG.FORM_ENDPOINT){try{fetch(CONFIG.FORM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},keepalive:true,body:JSON.stringify({nome:n,email:m,whatsapp:t,parcela_mensal:parc,aporte:+parc||0,stage_id:((+parc||0)>1000?17:18),origem:"site-calculadora",quando:new Date().toISOString()})})}catch(x){}}
  location.hash="obrigado";
 });
}
window.addEventListener("hashchange",route);route();

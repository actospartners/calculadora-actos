<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quanto você precisa ter para viver de renda | Actos Partners</title>
<meta name="description" content="Calculadora gratuita: descubra o patrimônio que mantém o seu padrão de vida, corrigido pela inflação. Actos Partners.">
<meta name="robots" content="noindex">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@400;500;600;700&display=swap">
<style>
/* Layout: fundo escuro sóbrio, títulos grandes em caixa normal, um único acento (verde-água), botões chapados, fotografia em duotone verde como protagonista. Sem brilho, vidro ou gradiente decorativo. */
:root{--bg:#0d1d18;--bg2:#10241F;--card:#14302a;--line:rgba(214,232,214,.16);--fg:#EAF1EB;--mut:#a9bdb2;--acc:#06E8D6;--accd:#10241F;--menta:#D6E8D6;--f:"Jost","Futura",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:18px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow-x:hidden}
a{color:inherit}:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.full{margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1120px;margin:0 auto;position:relative;z-index:1}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
h1,h2,h3{margin:0;font-weight:500;line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{display:block;color:var(--acc);font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:14px}
/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-left,0px)) 0;background:rgba(13,29,24,.96);border-bottom:1px solid var(--line)}
.nav .in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.links{display:flex;gap:24px;align-items:center}.links a{color:var(--fg);text-decoration:none;font-weight:500;font-size:15px;opacity:.85}.links a:hover{opacity:1}
.nbtn{background:var(--acc);color:var(--accd)!important;font-weight:600;padding:10px 18px;border-radius:4px;opacity:1!important}
.burger{display:none;background:none;border:1px solid var(--line);color:var(--fg);border-radius:4px;padding:8px 12px;font:500 14px var(--f)}
/* HERO */
.hero,.ph{position:relative;overflow:hidden;background:var(--bg)}
.hero{min-height:720px;padding-bottom:70px}.ph{min-height:420px;padding-bottom:70px}
.himg,.pimg{position:absolute;top:0;bottom:0;right:0;width:58%;background-size:cover;background-position:center;opacity:.9;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 38%);mask-image:linear-gradient(90deg,transparent 0,#000 38%)}
.pimg{width:50%}
.hero .in,.ph .in{padding-top:150px}
.hero h1{font-size:clamp(40px,6vw,72px);max-width:11em;margin-top:6px}.hero h1 b,.ph h1 b{color:var(--acc);font-weight:500}
.ph h1{font-size:clamp(34px,5vw,58px);max-width:14em}
.hero p,.ph p{max-width:30em;font-size:19px;color:var(--mut);margin:22px 0 0}
.cta{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:10px 28px;text-decoration:none;cursor:pointer;font:600 16px/1.15 var(--f);border-radius:4px;border:0}
.cta.p{background:var(--acc);color:var(--accd)}.cta.s{background:transparent;color:var(--fg);border:1px solid rgba(234,241,235,.4)}
.cta:hover{filter:brightness(1.08)}.hbtns{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.h3x{display:flex;gap:10px;align-items:center;margin-top:30px}.h3x i{display:block;height:6px;border-radius:1px}.h3x span{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--mut)}
/* CORPO */
.body{position:relative;z-index:2;background:var(--bg);border-top:1px solid var(--line)}
.wmw,.wm{display:none}
section.s{padding-top:100px}
.s h2{font-size:clamp(28px,3.8vw,46px);max-width:19em;margin:0 0 20px}
.lead{max-width:40em;color:var(--mut);font-size:19px;margin:0}
.sub{margin-top:28px;font-size:22px;font-weight:500;max-width:30em}
.quotes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:34px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.q{padding:30px 28px 30px 0;border-right:1px solid var(--line)}.q+.q{padding-left:28px}.q:last-child{border-right:0}
.q p{margin:0;font-size:22px;line-height:1.35;font-weight:500}.q b{color:var(--acc);font-weight:500}.q small{display:block;margin-top:16px;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:34px;border-top:1px solid var(--line)}
.card{padding:26px 24px 26px 0;border-right:1px solid var(--line)}.card+.card{padding-left:24px}.card:last-child{border-right:0}
.card .n{font-family:var(--mono);font-size:13px;color:var(--acc);letter-spacing:.12em}.card h3{font-size:22px;margin:10px 0 8px}.card p{margin:0;color:var(--mut);font-size:16.5px}
.bridge{margin-top:36px;padding:26px 30px;border-left:3px solid var(--acc);background:var(--bg2);font-size:21px}.bridge b{color:var(--acc);font-weight:500}
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.split .ph2{height:100%;min-height:420px;background-size:cover;background-position:center;border-radius:4px}
.cmp{display:grid;grid-template-columns:1fr 1fr;margin-top:30px;border:1px solid var(--line)}
.cmp>div{padding:26px 30px}.cmp .b{background:var(--bg2);border-left:1px solid var(--line)}
.cmp h3{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;margin-bottom:12px;color:var(--mut)}.cmp .b h3{color:var(--acc)}
.cmp p{margin:0;padding:13px 0;border-top:1px solid var(--line);font-size:18px}
.foot2{margin-top:22px;font-size:22px;font-weight:500}
.hz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:34px;border:1px solid var(--line)}
.hzc{padding:32px 30px;border-right:1px solid var(--line)}.hzc:last-child{border-right:0}
.hzc .pc{font:500 56px/1 var(--f);color:var(--acc)}.hzc .pz{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-top:8px}
.hzc h3{font-size:28px;margin:16px 0 8px}.hzc p{margin:0;color:var(--mut);font-size:16.5px}
.quiz{background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:36px;margin-top:30px}
.qh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.qh .mono{color:var(--acc)}
.prog{display:flex;gap:6px;margin:16px 0 26px}.prog i{flex:1;height:3px;background:rgba(214,232,214,.18)}.prog i.on{background:var(--acc)}
.qt{font-size:clamp(22px,3vw,30px);font-weight:500;line-height:1.25;margin:0 0 26px;max-width:28em}
.opts{display:flex;gap:12px;flex-wrap:wrap}.opts button{flex:1 1 140px;min-height:54px;font:600 17px var(--f);color:var(--fg);background:transparent;border:1px solid rgba(234,241,235,.35);border-radius:4px;cursor:pointer}.opts button:hover{background:var(--acc);color:var(--accd);border-color:var(--acc)}
.res h3{font-size:clamp(24px,3.4vw,34px);margin:6px 0 12px}.res p{color:var(--mut);font-size:18px;max-width:38em;margin:0 0 18px}
.bars{display:grid;gap:14px;margin:18px 0 26px}.bar{display:grid;grid-template-columns:110px 1fr 120px;gap:14px;align-items:center}
.bar .t{height:4px;background:rgba(214,232,214,.16);position:relative}.bar .t i{position:absolute;left:0;top:0;bottom:0}.bar b{font-size:14px;text-align:right}
.lnk{background:none;border:0;color:var(--acc);text-decoration:underline;font:500 15px var(--f);cursor:pointer;margin-left:10px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:34px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.steps li{padding:24px 22px 0 0;border-right:1px solid var(--line)}.steps li+li{padding-left:22px}.steps li:last-child{border-right:0}
.steps .n{font-family:var(--mono);font-size:13px;color:var(--acc)}.steps b{display:block;font-size:22px;font-weight:500;margin:8px 0 6px}.steps span:last-child{color:var(--mut);font-size:16.5px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.chips span{border:1px solid var(--line);border-radius:99px;padding:9px 20px;font-weight:500}
.esp{margin-top:32px;padding:34px 36px;background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--acc)}
.esp .mono{color:var(--acc)}.esp h3{font-size:clamp(24px,3.2vw,34px);margin:10px 0 10px}.esp p{margin:0;color:var(--mut);font-size:18px;max-width:40em}
.close{position:relative;z-index:2;margin-top:100px;padding-top:90px;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--bg2);border-top:1px solid var(--line)}
.close h2{font-size:clamp(28px,4vw,44px);max-width:17em;margin:0 0 14px}.close .lead{color:var(--mut)}
.form{margin-top:30px;border:1px solid var(--line);padding:30px;background:var(--bg)}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.form label{display:block;font-weight:500;font-size:15px;margin-bottom:6px;color:var(--mut)}
.form input[type=text],.form input[type=email],.form input[type=tel]{width:100%;height:50px;font:inherit;font-size:17px;padding:0 14px;border:1px solid rgba(214,232,214,.25);border-radius:4px;background:var(--bg2);color:var(--fg)}
.form .go{display:flex;margin-top:20px;width:min(460px,100%)}
.err{color:#ffc9a3;min-height:1.2em;margin:10px 0 0;font-size:15px}.ok{color:var(--acc);font-weight:500;margin:10px 0 0}
.hp{position:absolute;left:-9999px;opacity:0}.wa{margin-top:16px;display:block;color:var(--mut)}.wa a{color:var(--acc);font-weight:500}
footer{position:relative;z-index:2;background:#09150f;color:var(--mut);font-size:14px;padding-top:40px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
footer .in{display:flex;flex-wrap:wrap;gap:20px 40px;justify-content:space-between;align-items:flex-start}footer a{color:var(--mut);text-decoration:none;margin-right:16px}footer p{margin:6px 0}
/* páginas internas */
.back{display:inline-block;margin-bottom:14px;color:var(--acc);text-decoration:none;font-weight:500}
.hzbig{display:grid;grid-template-columns:.9fr 1.1fr;margin-top:24px;border:1px solid var(--line);background:var(--bg2)}
.hzbig>div{padding:34px 36px}.hzbig .l{border-right:1px solid var(--line)}
.hzbig .top{display:flex;justify-content:space-between;align-items:center}.hzbig .top span{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.hzbig .top b{font:500 46px/1 var(--f);color:var(--acc)}.hzbig h3{font-size:42px;margin:14px 0 8px}.hzbig .ob{font-size:22px;font-weight:500;color:var(--acc);margin:0 0 12px}
.hzbig p{margin:0;color:var(--mut);font-size:17px}.hzbig h4{margin:0 0 8px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:500}
.hzbig ul{margin:0 0 22px;padding:0;list-style:none;display:grid;gap:8px}.hzbig li{padding-left:22px;position:relative}.hzbig li::before{content:"";position:absolute;left:0;top:.8em;width:12px;height:1px;background:var(--acc)}
.sig{margin-top:16px;padding:14px 16px;border:1px solid var(--line);color:var(--fg);font-size:16px}.sig b{color:var(--acc);font-weight:500}
.faq{margin-top:26px;border-top:1px solid var(--line)}.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:20px 0;font-weight:500;font-size:20px;display:flex;justify-content:space-between;gap:12px}.faq summary::after{content:"+";font-size:26px;color:var(--acc)}.faq details[open] summary::after{content:"–"}
.faq details p{margin:0 0 20px;color:var(--mut);max-width:44em}
.strat{display:grid;grid-template-columns:90px 1fr;gap:22px;padding:34px 0;border-top:1px solid var(--line)}.strat .n{font:500 52px/1 var(--f);color:var(--acc);opacity:.6}
.strat h3{font-size:32px;margin:0 0 4px}.strat .sb{font-size:21px;color:var(--acc);margin:0 0 10px}.strat p{margin:0 0 12px;color:var(--mut)}
.strat h4{margin:16px 0 4px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg);font-weight:500}
.tlink{color:var(--acc);font-weight:500;text-decoration:none}.tlink:hover{text-decoration:underline}
.tbl{margin-top:26px;border:1px solid var(--line)}.tr{display:grid;grid-template-columns:1fr 1.2fr 1.2fr}.tr>div{padding:16px 20px;border-top:1px solid var(--line);font-size:16.5px}
.tr.h>div{border:0;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);background:var(--bg2)}.tr>div:first-child{font-weight:500}.tr>div:last-child{background:var(--bg2)}
.prof{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}
.pf{border:1px solid var(--line);background:var(--bg2)}.pf .cimg{height:190px;background-size:cover;background-position:center}.pf .pb{padding:24px 26px 26px}
.pf .n{font-family:var(--mono);font-size:13px;color:var(--acc);letter-spacing:.12em}.pf h3{font-size:24px;margin:8px 0 8px}.pf p{margin:0 0 12px;color:var(--mut);font-size:16.5px}
.pf .hd{margin-top:8px;padding-top:12px;border-top:1px solid var(--line);font-size:16px}.pf .hd b{color:var(--acc);font-weight:500}
.nao{margin-top:34px;padding:28px 30px;border:1px solid var(--line)}.nao h3{font-size:24px;margin-bottom:10px}.nao ul{margin:0 0 14px;padding-left:20px;display:grid;gap:6px;color:var(--mut)}
.pr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-top:28px;border-top:1px solid var(--line)}
.pri{padding:26px 28px 26px 0;border-bottom:1px solid var(--line)}.pri:nth-child(even){padding-left:28px;border-left:1px solid var(--line)}.pri .n{font-family:var(--mono);font-size:13px;color:var(--acc)}.pri h3{font-size:24px;margin:8px 0 6px}.pri p{margin:0;color:var(--mut)}
.sob{display:grid;grid-template-columns:1.1fr 1fr;gap:44px;margin-top:24px;align-items:start}.sob p{color:var(--mut);font-size:19px;margin:0 0 16px}
.sc{background:var(--bg2);border:1px solid var(--line);padding:30px}.sc .av{width:72px;height:72px;border-radius:50%;border:1px solid var(--acc);display:grid;place-items:center;font:500 26px var(--f);color:var(--acc);margin-bottom:16px}
.sc .mono{color:var(--acc)}.sc h3{font-size:28px;margin:6px 0 8px}.sc p{color:var(--mut);font-size:16.5px;margin:0}
.emp{margin-top:26px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line)}.emp div{padding:20px 22px;border-right:1px solid var(--line)}.emp div:last-child{border-right:0}
.emp small{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}.emp b{font-weight:500;font-size:17px}
.fe{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:20px;margin-top:26px}
.ac{border:1px solid var(--line);background:var(--bg2);text-decoration:none;display:block;color:inherit}.ac:hover{border-color:var(--acc)}
.ac .cimg{height:200px;background-size:cover;background-position:center}.ac .pb{padding:22px 24px 24px}
.ac .tg{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}.ac h3{font-size:22px;margin:10px 0 8px}.ac p{margin:0 0 12px;color:var(--mut);font-size:16px}.ac small{color:var(--mut)}
.art{max-width:760px;margin:0 auto}.art h2{font-size:30px;margin:44px 0 12px;max-width:none}.art p{font-size:19px;color:#cfdcd3;margin:0 0 6px}
.contact{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:start}.ci{border:1px solid var(--line);padding:26px;background:var(--bg2)}
.ci small{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:16px}.ci small:first-child{margin-top:0}.ci b{font-weight:500}
.soon{text-align:center;padding:30px 0}.soon .mono{color:var(--acc)}
.qcta{margin-top:80px;padding:34px;border:1px solid var(--line);background:var(--bg2);display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.qcta h3{font-size:clamp(22px,3vw,30px);max-width:20em}.qcta .mono{color:var(--acc)}
.cl2{margin-top:100px}
@media (max-width:900px){
 .links{display:none}.links.open{display:flex;position:absolute;top:68px;left:0;right:0;flex-direction:column;align-items:flex-start;background:var(--bg);border-bottom:1px solid var(--line);padding:18px max(16px,env(safe-area-inset-left,0px)) 24px;gap:16px}.burger{display:block}
 .himg,.pimg{position:relative;width:calc(100% + 32px);height:260px;margin:0 -16px;-webkit-mask-image:linear-gradient(0deg,transparent 0,#000 40%);mask-image:linear-gradient(0deg,transparent 0,#000 40%)}
 .hero,.ph{display:flex;flex-direction:column-reverse;min-height:0;padding-bottom:40px}.hero .in,.ph .in{padding-top:30px}.hero,.ph{padding-top:68px}
 .quotes,.cards,.hz,.steps,.row,.cmp,.hzbig,.sob,.contact,.fe,.prof,.pr,.split,.emp{grid-template-columns:1fr}
 .q,.q+.q,.card,.card+.card,.hzc,.steps li,.steps li+li,.pri,.pri:nth-child(even){padding-left:0;padding-right:0;border-right:0;border-left:0}
 .q,.card,.hzc,.steps li,.pri{border-bottom:1px solid var(--line);padding-bottom:22px;padding-top:22px}.hzc{padding-left:22px;padding-right:22px}
 .hzbig .l{border-right:0;border-bottom:1px solid var(--line)}.strat{grid-template-columns:1fr;gap:6px}.tr{grid-template-columns:1fr}.tr.h{display:none}
 .split .ph2{min-height:240px}.bar{grid-template-columns:90px 1fr 100px}.quiz,.form{padding:22px 18px}section.s{padding-top:64px}.emp div{border-right:0;border-bottom:1px solid var(--line)}
}

/* calculadora */
.cg{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.3fr);gap:28px;align-items:start}
.cp{border:1px solid var(--line);background:var(--bg2);padding:28px}
.cp.sticky{position:sticky;top:88px}
.cp h3{font-size:22px;margin:0 0 4px}.cp .hint{color:var(--mut);font-size:15px;margin:0 0 20px}
.fld{margin-bottom:24px}.fld label{display:block;font-weight:500;margin-bottom:8px}.fld small{display:block;color:var(--mut);font-size:14px;margin-top:6px}
.nin{display:flex;align-items:center;gap:10px;border:1px solid rgba(214,232,214,.3);border-radius:4px;background:var(--bg);padding:0 16px;height:60px}
.nin:focus-within{border-color:var(--acc)}.nin span{font-family:var(--mono);color:var(--mut);font-size:15px}
.nin input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font:500 28px var(--f)}
.nin.sm{height:48px}.nin.sm input{font-size:20px}
input[type=range]{width:100%;margin:14px 0 0;accent-color:#06E8D6;height:4px}
.tg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tg2 button{text-align:left;border:1px solid rgba(214,232,214,.3);background:transparent;color:var(--fg);border-radius:4px;padding:14px 16px;cursor:pointer;font:inherit;display:grid;gap:4px}
.tg2 button b{font-weight:600}.tg2 button span{font-size:14px;color:var(--mut)}
.tg2 button[aria-pressed="true"]{border-color:var(--acc);background:rgba(6,232,214,.08)}.tg2 button[aria-pressed="true"] b{color:var(--acc)}
details.adv{border-top:1px solid var(--line);padding-top:16px;margin-top:6px}details.adv summary{cursor:pointer;font-weight:500;color:var(--acc);list-style:none}details.adv summary::before{content:"+ "}details.adv[open] summary::before{content:"– "}
details.adv .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}details.adv label{font-size:15px}
.big{padding:34px;border:1px solid var(--line);background:var(--bg2);border-left:3px solid var(--acc)}
.big .lab{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.big .num{font:500 clamp(44px,7vw,72px)/1.05 var(--f);margin:10px 0 8px;font-variant-numeric:tabular-nums}
.big p{margin:0;color:var(--mut);font-size:18px;max-width:34em}.big p b{color:var(--fg);font-weight:500}
.cd{margin-top:18px;border:1px solid var(--line);background:var(--bg2);padding:26px 28px}
.cd h4{margin:0 0 4px;font-size:20px;font-weight:500}.cd .sb{margin:0 0 18px;color:var(--mut);font-size:15.5px}
.stk{display:flex;height:44px;border-radius:3px;overflow:hidden;background:rgba(214,232,214,.1)}.stk i{display:block;height:100%}
.lg{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:14px}.lg div{display:flex;align-items:center;gap:10px}.lg i{width:12px;height:12px;border-radius:2px;display:block}.lg b{font-weight:500}.lg small{color:var(--mut);display:block;font-size:13.5px}
.hb{display:grid;gap:16px}.hb .r{display:grid;grid-template-columns:150px 1fr 120px;gap:14px;align-items:center}.hb .r span{font-size:15.5px}
.hb .t{height:14px;background:rgba(214,232,214,.1);border-radius:2px;overflow:hidden}.hb .t i{display:block;height:100%;transition:width .35s}
.hb .r b{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.gap{margin-top:18px;padding:18px 20px;border:1px solid var(--line);font-size:19px}.gap .num{color:var(--acc);font-weight:600}
.why{margin-top:16px;color:var(--mut);font-size:16px;line-height:1.55}.why strong{color:var(--fg);font-weight:500}.why .num{color:var(--acc)}
.alrt{padding:20px 22px;border:1px solid #e8a07a;color:#ffd9bf;background:rgba(232,160,122,.08);font-size:17px}
.chart{width:100%;height:auto;display:block}
.leg2{display:flex;gap:22px;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--mut)}.leg2 i{display:inline-block;width:22px;height:0;border-top:3px solid var(--acc);vertical-align:middle;margin-right:8px}.leg2 i.d{border-top:2px dashed #d6e8d6}
.disc{margin-top:24px;color:var(--mut);font-size:14px;max-width:62em}
@media (max-width:900px){.cg{grid-template-columns:1fr}.cp.sticky{position:static}.hb .r{grid-template-columns:1fr;gap:6px}.hb .r b{text-align:left}.tg2{grid-template-columns:1fr}details.adv .two{grid-template-columns:1fr}.big{padding:24px}}

.gate{display:grid;grid-template-columns:1.1fr 1fr;gap:44px;align-items:start}
.gate .st{display:grid;gap:0;margin-top:26px;border-top:1px solid var(--line)}.gate .st div{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
.gate .st b{font-family:var(--mono);color:var(--acc);font-weight:500}.gate .st span{color:var(--mut)}.gate .st strong{display:block;color:var(--fg);font-weight:500;font-size:19px}
.gate .form{margin-top:0}
.nav .nbtn2{border:1px solid rgba(234,241,235,.4);padding:9px 16px;border-radius:4px;color:var(--fg);text-decoration:none;font-weight:500;font-size:15px}
.cfoot{margin-top:70px}
@media (max-width:900px){.gate{grid-template-columns:1fr}}
</style>

 $('renda').value="10.000";$('anos').value="10";$('cons').value="30";$('inf').value="4,5";$('rent').value="10";
 var mode='perp';
 function sync(from){ if(from==='rendaR')$('renda').value=(+$('rendaR').value).toLocaleString('pt-BR'); if(from==='anosR')$('anos').value=$('anosR').value; if(from==='renda'){var v=money($('renda'));$('rendaR').value=Math.min(100000,Math.max(1000,v))} if(from==='anos'){$('anosR').value=Math.min(40,Math.max(1,Math.round(dec($('anos')))||1))} calc()}
 $('rendaR').addEventListener('input',function(){sync('rendaR')});$('anosR').addEventListener('input',function(){sync('anosR')});
 mask($('renda'),function(){sync('renda')});$('anos').addEventListener('input',function(){sync('anos')});
 ['atual','aporte'].forEach(function(id){mask($(id),calc)});['inf','rent','cons'].forEach(function(id){$(id).addEventListener('input',calc)});
 function setMode(m){mode=m;$('mPerp').setAttribute('aria-pressed',m==='perp');$('mCons').setAttribute('aria-pressed',m==='cons');$('consField').hidden=m!=='cons';calc()}
 $('mPerp').addEventListener('click',function(){setMode('perp')});$('mCons').addEventListener('click',function(){setMode('cons')});
 function chart(anos,atual,aporte,rNom,target){
  var W=640,H=250,pl=52,pr=16,pt=14,pb=34,pts=[],m=anos*12,i;
  function w(mm){var g=Math.pow(1+rNom,mm);return atual*g+(rNom>0?aporte*(g-1)/rNom:aporte*mm)}
  var max=Math.max(target,w(m),1);function X(mm){return pl+(W-pl-pr)*mm/Math.max(m,1)}function Y(v){return pt+(H-pt-pb)*(1-v/max)}
  var step=Math.max(1,Math.round(m/60));for(i=0;i<=m;i+=step)pts.push(X(i).toFixed(1)+','+Y(w(i)).toFixed(1));pts.push(X(m).toFixed(1)+','+Y(w(m)).toFixed(1));
  var ticks='',k;for(k=0;k<=4;k++){var yv=max*k/4;ticks+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(yv)+'" y2="'+Y(yv)+'" stroke="rgba(214,232,214,.12)"/><text x="'+(pl-8)+'" y="'+(Y(yv)+4)+'" text-anchor="end" fill="#a9bdb2" font-size="11">'+(yv>=1e6?(yv/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi':yv>=1e3?Math.round(yv/1e3)+' mil':Math.round(yv))+'</text>'}
  var ys='';var ny=Math.min(anos,6);for(k=0;k<=ny;k++){var a=Math.round(anos*k/ny);ys+='<text x="'+X(a*12)+'" y="'+(H-10)+'" text-anchor="middle" fill="#a9bdb2" font-size="11">'+a+(k===0?'':' a')+'</text>'}
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução do patrimônio até a meta">'+ticks+ys+'<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(target)+'" y2="'+Y(target)+'" stroke="#d6e8d6" stroke-width="2" stroke-dasharray="6 5"/><polyline points="'+pts.join(' ')+'" fill="none" stroke="#06E8D6" stroke-width="3" stroke-linejoin="round"/><circle cx="'+X(m)+'" cy="'+Y(w(m))+'" r="5" fill="#06E8D6"/></svg>'}
 function calc(){
  var renda=money($('renda')),anos=Math.max(0,Math.min(60,Math.round(dec($('anos'))))),inf=dec($('inf'))/100,rent=dec($('rent'))/100,atual=money($('atual')),aporte=money($('aporte'));
  var consAnos=Math.max(1,Math.min(60,Math.round(dec($('cons')))||1));
  var real=(1+rent)/(1+inf)-1,rNom=Math.pow(1+rent,1/12)-1,rReal=Math.pow(1+real,1/12)-1,rendaF=renda*Math.pow(1+inf,anos);
  var anosTxt=anos+(anos===1?' ano':' anos'),out=$('resc');
  if(mode==='perp'&&rReal<=0){out.innerHTML='<div class="alrt">Com a rentabilidade igual ou menor que a inflação, nenhum patrimônio sustenta essa renda para sempre. Ajuste a rentabilidade esperada ou escolha consumir o patrimônio aos poucos.</div>';return}
  var n=consAnos*12,patReal;
  if(mode==='perp')patReal=rendaF/rReal;else patReal=Math.abs(rReal)<1e-9?rendaF*n:rendaF*(1-Math.pow(1+rReal,-n))/rReal;
  var patNaive=rNom>0?rendaF/rNom:0,patHoje=patReal/Math.pow(1+inf,anos);
  var rende=patReal*rNom,meio=rende-rendaF;
  var hasNow=atual>0||aporte>0,now=0;
  if(hasNow){var m=anos*12,g=Math.pow(1+rNom,m);now=atual*g+(rNom>0?aporte*(g-1)/rNom:aporte*m)}
  var max=Math.max(patReal,patNaive,now,1);
  var h='<div class="big"><span class="lab">Você vai precisar de</span><div class="num">'+brl.format(patReal)+'</div><p>daqui a <b>'+anosTxt+'</b>, para viver com o padrão de <b>'+brl.format(renda)+'</b> por mês de hoje, '+(mode==='perp'?'sem o patrimônio encolher.':'consumindo o patrimônio ao longo de '+consAnos+' anos.')+' Em dinheiro de hoje, isso equivale a <b>'+brl.format(patHoje)+'</b>.</p></div>';
  var rendaTxt=brl.format(rendaF);
  h+='<div class="cd"><h4>A inflação mexe na sua renda</h4><p class="sb">Os '+brl.format(renda)+' de hoje precisarão ser <b style="color:#EAF1EB;font-weight:500">'+rendaTxt+'</b> por mês, daqui a '+anosTxt+'. Rentabilidade acima da inflação: <b style="color:#06E8D6;font-weight:500">'+pct(real)+'</b> ao ano.</p></div>';
  if(meio>=0){var a=meio/rende*100,b=100-a;
   h+='<div class="cd"><h4>O que acontece com o rendimento, todo mês</h4><p class="sb">Quanto do rendimento é seu para viver e quanto precisa ficar investido.</p><div class="stk"><i style="width:'+b+'%;background:#06E8D6"></i><i style="width:'+a+'%;background:#6E8C7D"></i></div><div class="lg"><div><i style="background:#06E8D6"></i><span><b>Sobra para você viver: '+brl.format(rendaF)+'</b><small>A renda corrigida</small></span></div><div><i style="background:#6E8C7D"></i><span><b>Fica investido: '+brl.format(meio)+'</b><small>'+(mode==='perp'?'Só para repor a inflação':'Volta para o patrimônio')+'</small></span></div></div><p class="why">O patrimônio rende <b style="color:#EAF1EB;font-weight:500">'+brl.format(rende)+'</b> por mês ('+pct(rent)+' ao ano). Parte dele precisa ficar guardada para a inflação não comer o seu dinheiro.</p></div>'}
  else{h+='<div class="cd"><h4>O que acontece com o rendimento, todo mês</h4><p class="sb">No começo, o rendimento cobre só parte da renda; o resto sai do próprio patrimônio.</p><div class="lg"><div><i style="background:#06E8D6"></i><span><b>Rende: '+brl.format(rende)+'</b></span></div><div><i style="background:#E8A07A"></i><span><b>Sai do patrimônio: '+brl.format(-meio)+'</b><small>O patrimônio vai sendo consumido, até acabar em '+consAnos+' anos</small></span></div></div></div>'}
  h+='<div class="cd"><h4>A conta comum e a conta certa</h4><p class="sb">Por que o número certo é maior do que parece.</p><div class="hb"><div class="r"><span>Sem proteger da inflação</span><div class="t"><i style="width:'+(patNaive/max*100)+'%;background:#6E8C7D"></i></div><b>'+brl.format(patNaive)+'</b></div><div class="r"><span>Protegendo da inflação</span><div class="t"><i style="width:'+(patReal/max*100)+'%;background:#06E8D6"></i></div><b>'+brl.format(patReal)+'</b></div>'+(hasNow?'<div class="r"><span>Onde você chega no ritmo de hoje</span><div class="t"><i style="width:'+(now/max*100)+'%;background:#d6e8d6"></i></div><b>'+brl.format(now)+'</b></div>':'')+'</div>';
  var diff=patReal-patNaive;
  h+='<p class="why">'+(diff>0?'<strong>Por que a conta certa é maior?</strong> Se você gastar todo o rendimento, o patrimônio para de crescer e a inflação come o seu poder de compra ano a ano. Protegendo, você só usa o que rende acima da inflação. A diferença é de <span class="num">'+brl.format(diff)+'</span>.':'<strong>Consumindo o patrimônio,</strong> você precisa de menos dinheiro guardado, mas ele acaba depois de '+consAnos+' anos e não fica para a família.')+'</p></div>';
  if(hasNow){var falta=patReal-now;
   h+='<div class="cd"><h4>Você está no caminho?</h4><p class="sb">Seu patrimônio de hoje e o aporte mensal, crescendo à rentabilidade informada, até a meta.</p>'+chart(anos,atual,aporte,rNom,patReal)+'<div class="leg2"><span><i></i>Seu patrimônio no ritmo de hoje</span><span><i class="d"></i>Meta: '+brl.format(patReal)+'</span></div><div class="gap">'+(falta>0?'Faltam <span class="num">'+brl.format(falta)+'</span> para chegar lá em '+anosTxt+'.':'No ritmo de hoje, você chega lá. Sobram <span class="num">'+brl.format(-falta)+'</span>.')+'</div></div>'}
  out.innerHTML=h;
 }
 sync('renda');sync('anos');calc();
}

 document.getElementById("app").innerHTML='<nav class="nav"><div class="in"><a href="#" aria-label="Actos Partners">'+logo(150)+'</a><a class="nbtn2" href="'+WHATS+'" target="_blank" rel="noopener">Falar com um especialista</a></div></nav>'+
 '<header class="ph full"><div class="pimg" style="background-image:url('+IMG.calc+')"></div><div class="in"><span class="eyebrow">Calculadora gratuita</span><h1>Quanto você precisa ter para <b>viver de renda.</b></h1><p>O patrimônio que mantém o seu padrão de vida, corrigido pela inflação até o dia em que você parar de trabalhar.</p></div></header>'+
 '<main class="body full"><div class="in">'+calcHtml()+'<div class="qcta cfoot"><div><span class="mono">Próximo passo</span><h3>Quer transformar esse número em um plano?</h3><p style="margin:8px 0 0;color:#a9bdb2">Fale com um especialista da Actos e veja o caminho com os seus números.</p></div><a class="cta p" href="'+WHATS+'" target="_blank" rel="noopener">Falar com um especialista</a></div></div></main>'+
 '<footer class="full"><div class="in"><div>'+logo(150)+'<p>© 2026 Actos Partners · CNPJ 64.146.801/0001-42</p><p>As simulações são ilustrativas e não representam promessa de rentabilidade.</p></div></div></footer>';

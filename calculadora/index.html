<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Actos Partners — Planejamento Patrimonial</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Calcule quanto você precisa ter para viver de renda, com a inflação dentro da conta. Simulação gratuita da Actos Partners.">
<meta property="og:title" content="Calculadora: quanto você precisa para viver de renda"><meta property="og:description" content="Descubra o seu número em 1 minuto. Simulação gratuita da Actos Partners.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@400;500;600;700&display=swap">
<style>
/* Layout amigável: topo e fechamento escuros, corpo claro com cartões brancos de cantos grandes, sombra suave e UM destaque vivo (aqua) só em botões e números-chave. */
:root{--mint:#06E8D6;--dk:#10241F;--dk2:#1B3A32;--ink:#10241F;--mut:#4d5f56;--ln:#dcdfd2;--paper:#F2EFE8;--btn:#2A6C58;--btnh:#1B3A32;--wh:#FBF9F4;--acc:#06E8D6;--accd:#05302b;--accT:#2A6C58;--r:18px;--r2:12px;--sh:0 10px 30px -18px rgba(16,36,31,.35);
 --f:"Jost","Futura",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:light}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:18px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow-x:hidden}
a{color:inherit}:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.full{margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1120px;margin:0 auto;position:relative;z-index:1}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
h1,h2,h3{margin:0;font-weight:600;line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{display:inline-block;color:var(--accT);background:rgba(42,108,88,.12);font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;border-radius:99px;margin-bottom:16px}
.hero .eyebrow,.ph .eyebrow,.close .eyebrow{color:var(--mint);background:rgba(127,233,196,.16)}
/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-left,0px)) 0;background:#fff;box-shadow:0 2px 14px -8px rgba(16,36,31,.35)}
.nav .in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.links{display:flex;gap:22px;align-items:center}.links a{color:var(--ink);text-decoration:none;font-weight:500;font-size:15px}.links a:hover{color:var(--btn)}
.nbtn{background:var(--btn);color:#fff!important;font-weight:700;padding:10px 22px;border-radius:99px}
.nbtn2{background:var(--btn);padding:10px 20px;border-radius:99px;color:#fff;text-decoration:none;font-weight:700;font-size:15px}
.burger{display:none;background:none;border:1px solid #c9d0c3;color:var(--ink);border-radius:99px;padding:8px 16px;font:600 14px var(--f)}
/* HERO e cabeçalhos (escuros) */
.hero,.ph{position:relative;overflow:hidden;background:var(--dk);color:#EAF1EB}
.hero{min-height:720px;padding-bottom:80px}.ph{min-height:420px;padding-bottom:80px}
.himg,.pimg{position:absolute;top:0;bottom:0;right:0;width:58%;background-size:cover;background-position:center 15%;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 38%);mask-image:linear-gradient(90deg,transparent 0,#000 38%)}.pimg{width:50%}
.hero .in,.ph .in{padding-top:150px}
.hero h1{font-size:clamp(40px,6vw,74px);max-width:11em}.hero h1 b,.ph h1 b{color:var(--mint);font-weight:600}
.ph h1{font-size:clamp(34px,5vw,58px);max-width:14em}
.hero p,.ph p{max-width:30em;font-size:20px;color:#b9c9be;margin:22px 0 0}
.cta{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:12px 32px;text-decoration:none;cursor:pointer;font:700 17px/1.15 var(--f);border-radius:99px;border:0;transition:transform .15s,box-shadow .15s}
.cta.p{background:var(--btn);color:#fff;box-shadow:0 10px 22px -12px rgba(42,108,88,.8)}.cta.p:hover{background:var(--btnh)}
.hero .cta.p,.ph .cta.p,.close .cta.p,.qcta .cta.p,.esp .cta.p,.big .cta.p,.hzbig .cta.p{background:#fff;color:var(--ink);box-shadow:none}
.cta.s{background:transparent;color:inherit;border:2px solid currentColor}.hero .cta.s,.ph .cta.s,.close .cta.s,.dark .cta.s{color:#EAF1EB;border-color:rgba(234,241,235,.55)}
.cta:hover{transform:translateY(-2px)}
.hbtns{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.h3x{display:flex;gap:10px;align-items:center;margin-top:30px}.h3x i{display:block;height:8px;border-radius:99px}.h3x span{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:#b9c9be}
/* CORPO CLARO */
.body{position:relative;z-index:2;background:var(--paper)}
.wmw,.wm{display:none}
section.s{padding-top:96px}
.s h2{font-size:clamp(28px,3.8vw,46px);max-width:19em;margin:0 0 18px}
.lead{max-width:40em;color:var(--mut);font-size:19px;margin:0}
.sub{margin-top:28px;font-size:22px;font-weight:500;max-width:30em}
/* cartões */
.quotes,.cards,.hz,.steps,.pr,.emp,.fe,.prof{display:grid;gap:18px}
.quotes{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:32px}
.q,.card,.hzc,.steps li,.pri,.emp div,.ac,.pf,.ci,.sc,.cp,.cd,.faq details,.nao{background:var(--wh);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh)}
.q{padding:28px}.q p{margin:0;font-size:21px;line-height:1.35;font-weight:500}.q b{color:var(--accT);font-weight:600}.q small{display:block;margin-top:16px;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.cards{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:32px}
.card{padding:26px}.card .n{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:rgba(42,108,88,.14);color:var(--accT);font-family:var(--mono);font-size:13px;font-weight:600}
.card h3{font-size:21px;margin:14px 0 8px}.card p{margin:0;color:var(--mut);font-size:16.5px}
.bridge{margin-top:30px;padding:28px 32px;border-radius:var(--r);background:var(--dk2);color:#EAF1EB;font-size:21px}.bridge b{color:var(--acc);font-weight:600}
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.split .ph2{height:100%;min-height:420px;background-size:cover;background-position:center 15%;border-radius:var(--r);box-shadow:var(--sh)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px}
.cmp>div{padding:28px 30px;border-radius:var(--r);background:var(--wh);border:1px solid var(--ln);box-shadow:var(--sh)}.cmp .b{background:var(--dk2);color:#EAF1EB;border-color:var(--dk2)}
.cmp h3{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;margin-bottom:12px;color:var(--mut)}.cmp .b h3{color:var(--acc)}
.cmp p{margin:0;padding:13px 0;border-top:1px solid rgba(127,154,134,.3);font-size:18px}
.foot2{margin-top:22px;font-size:22px;font-weight:500}
.hz{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:32px}
.hzc{padding:32px 30px;background:var(--wh)}.hzc:nth-child(2){background:var(--dk2);color:#EAF1EB;border-color:var(--dk2)}.hzc:nth-child(2) p,.hzc:nth-child(2) .pz{color:#b9c9be}
.hzc .pc{font:700 56px/1 var(--f);color:var(--accT)}.hzc:nth-child(2) .pc{color:var(--acc)}.hzc .pz{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-top:8px}
.hzc h3{font-size:28px;margin:16px 0 8px}.hzc p{margin:0;color:var(--mut);font-size:16.5px}
.quiz{background:var(--dk2);color:#EAF1EB;border-radius:24px;padding:38px;margin-top:30px;box-shadow:0 24px 50px -28px rgba(0,0,0,.6)}
.qh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.qh .mono{color:var(--acc)}
.prog{display:flex;gap:6px;margin:16px 0 26px}.prog i{flex:1;height:6px;border-radius:99px;background:rgba(214,232,214,.18)}.prog i.on{background:var(--acc)}
.qt{font-size:clamp(22px,3vw,30px);font-weight:500;line-height:1.25;margin:0 0 26px;max-width:28em}
.opts{display:flex;gap:12px;flex-wrap:wrap}.opts button{flex:1 1 140px;min-height:58px;font:700 18px var(--f);color:#EAF1EB;background:rgba(234,241,235,.08);border:1px solid rgba(234,241,235,.25);border-radius:14px;cursor:pointer}.opts button:hover{background:var(--acc);color:var(--accd);border-color:var(--acc)}
.res h3{font-size:clamp(24px,3.4vw,34px);margin:6px 0 12px}.res p{color:#b9c9be;font-size:18px;max-width:38em;margin:0 0 18px}
.bars{display:grid;gap:14px;margin:18px 0 26px}.bar{display:grid;grid-template-columns:110px 1fr 120px;gap:14px;align-items:center}
.bar .t{height:8px;border-radius:99px;background:rgba(214,232,214,.16);position:relative;overflow:hidden}.bar .t i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}.bar b{font-size:14px;text-align:right}
.lnk{background:none;border:0;color:var(--acc);text-decoration:underline;font:600 15px var(--f);cursor:pointer;margin-left:10px}
.steps{grid-template-columns:repeat(4,minmax(0,1fr));margin:32px 0 0;padding:0;list-style:none}
.steps li{padding:26px}.steps .n{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:rgba(42,108,88,.14);color:var(--accT);font-family:var(--mono);font-size:13px;font-weight:600}
.steps b{display:block;font-size:21px;font-weight:600;margin:12px 0 6px}.steps span:last-child{color:var(--mut);font-size:16.5px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.chips span{background:var(--wh);border:1px solid var(--ln);border-radius:99px;padding:10px 22px;font-weight:600;box-shadow:var(--sh)}
.esp{margin-top:32px;padding:36px 38px;border-radius:24px;background:var(--dk2);color:#EAF1EB}
.esp .mono{color:var(--acc)}.esp h3{color:#06E8D6;font-size:clamp(24px,3.2vw,34px);margin:10px 0 10px}.esp p{margin:0;color:#b9c9be;font-size:18px;max-width:40em}
.close{position:relative;z-index:2;margin-top:96px;padding-top:90px;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--dk);color:#EAF1EB;border-radius:32px 32px 0 0}
.close h2{font-size:clamp(28px,4vw,44px);max-width:17em;margin:0 0 14px}.close .lead{color:#b9c9be}
.form{margin-top:30px;border-radius:24px;padding:32px;background:#fff;color:var(--ink);box-shadow:0 24px 50px -28px rgba(0,0,0,.6)}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.form label{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.form input[type=text],.form input[type=email],.form input[type=tel]{width:100%;height:54px;font:inherit;font-size:17px;padding:0 16px;border:1.5px solid #c9d0c3;border-radius:14px;background:#FBF9F4;color:var(--ink)}
.form input:focus{border-color:#2A6C58;outline:none;box-shadow:0 0 0 4px rgba(42,108,88,.25)}
.form .go{display:flex;margin-top:22px;width:min(460px,100%)}
.err{color:#b4501f;min-height:1.2em;margin:10px 0 0;font-size:15px}.ok{color:#2A6C58;font-weight:600;margin:10px 0 0}
.hp{position:absolute;left:-9999px;opacity:0}.wa{margin-top:16px;display:block;color:var(--mut)}.wa a{color:#2A6C58;font-weight:700}
footer{position:relative;z-index:2;background:#0b1a16;color:#a9bdb2;font-size:14px;padding-top:40px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
footer .in{display:flex;flex-wrap:wrap;gap:20px 40px;justify-content:space-between;align-items:flex-start}footer a{color:#a9bdb2;text-decoration:none;margin-right:16px}footer p{margin:6px 0}
/* internas */
.back{display:inline-block;margin-bottom:14px;color:var(--accT);text-decoration:none;font-weight:600}
.hzbig{display:grid;grid-template-columns:.9fr 1.1fr;margin-top:24px;border-radius:24px;overflow:hidden;background:var(--dk2);color:#EAF1EB;box-shadow:var(--sh)}
.hzbig>div{padding:36px}.hzbig .l{border-right:1px solid rgba(214,232,214,.14)}
.hzbig .top{display:flex;justify-content:space-between;align-items:center}.hzbig .top span{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#b9c9be}
.hzbig .top b{font:700 46px/1 var(--f);color:var(--acc)}.hzbig h3{font-size:42px;margin:14px 0 8px}.hzbig .ob{font-size:22px;font-weight:600;color:var(--mint);margin:0 0 12px}
.hzbig p{margin:0;color:#b9c9be;font-size:17px}.hzbig h4{margin:0 0 8px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:500}
.hzbig ul{margin:0 0 22px;padding:0;list-style:none;display:grid;gap:8px}.hzbig li{padding-left:24px;position:relative}.hzbig li::before{content:"";position:absolute;left:0;top:.55em;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.sig{margin-top:16px;padding:14px 18px;border-radius:14px;background:rgba(42,108,88,.1);font-size:16px}.sig b{color:var(--acc);font-weight:600}
.faq{margin-top:26px;display:grid;gap:12px}.faq details{padding:0 24px}
.faq summary{cursor:pointer;list-style:none;padding:20px 0;font-weight:600;font-size:20px;display:flex;justify-content:space-between;gap:12px}.faq summary::after{content:"+";font-size:26px;color:var(--accT)}.faq details[open] summary::after{content:"–"}
.faq details p{margin:0 0 20px;color:var(--mut);max-width:44em}
.strat{display:grid;grid-template-columns:90px 1fr;gap:22px;padding:30px;margin-bottom:18px;background:var(--wh);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh)}.strat .n{font:700 52px/1 var(--f);color:var(--accT);opacity:.55}
.strat h3{font-size:32px;margin:0 0 4px}.strat .sb{font-size:21px;color:var(--accT);font-weight:600;margin:0 0 10px}.strat p{margin:0 0 12px;color:var(--mut)}
.strat h4{margin:16px 0 4px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);font-weight:600}
.tlink{color:var(--accT);font-weight:700;text-decoration:none}.tlink:hover{text-decoration:underline}
.tbl{margin-top:26px;border-radius:var(--r);overflow:hidden;background:var(--wh);box-shadow:var(--sh);border:1px solid var(--ln)}.tr{display:grid;grid-template-columns:1fr 1.2fr 1.2fr}.tr>div{padding:16px 20px;border-top:1px solid var(--ln);font-size:16.5px}
.tr.h>div{border:0;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);background:var(--dk2)}.tr>div:first-child{font-weight:600}.tr>div:last-child{background:#eefaf7}.tr.h>div:last-child{background:var(--dk2)}
.prof{grid-template-columns:1fr 1fr;margin-top:28px}
.pf{overflow:hidden}.pf .cimg{height:190px;background-size:cover;background-position:center 15%}.pf .pb{padding:24px 26px 26px}
.pf .n{font-family:var(--mono);font-size:13px;color:var(--accT);letter-spacing:.12em}.pf h3{font-size:24px;margin:8px 0 8px}.pf p{margin:0 0 12px;color:var(--mut);font-size:16.5px}
.pf .hd{margin-top:8px;padding-top:12px;border-top:1px solid var(--ln);font-size:16px}.pf .hd b{color:var(--accT);font-weight:600}
.nao{margin-top:34px;padding:28px 30px}.nao h3{font-size:24px;margin-bottom:10px}.nao ul{margin:0 0 14px;padding-left:20px;display:grid;gap:6px;color:var(--mut)}
.pr{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:28px}.pri{padding:26px 28px}.pri .n{font-family:var(--mono);font-size:13px;color:var(--accT)}.pri h3{font-size:24px;margin:8px 0 6px}.pri p{margin:0;color:var(--mut)}
.sob{display:grid;grid-template-columns:1.1fr 1fr;gap:44px;margin-top:24px;align-items:start}.sob p{color:var(--mut);font-size:19px;margin:0 0 16px}
.sc{padding:30px;background:var(--dk2);color:#EAF1EB;border-color:var(--dk2)}.sc .av{width:72px;height:72px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font:700 26px var(--f);color:var(--accd);margin-bottom:16px}
.sc .mono{color:var(--acc)}.sc h3{font-size:28px;margin:6px 0 8px}.sc p{color:#b9c9be;font-size:16.5px;margin:0}
.emp{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:26px}.emp div{padding:20px 22px}
.emp small{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}.emp b{font-weight:600;font-size:17px}
.fe{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:26px}
.ac{text-decoration:none;display:block;color:inherit;overflow:hidden;transition:transform .15s}.ac:hover{transform:translateY(-3px)}
.ac .cimg{height:200px;background-size:cover;background-position:center 15%}.ac .pb{padding:22px 24px 24px}
.ac .tg{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accT)}.ac h3{font-size:22px;margin:10px 0 8px}.ac p{margin:0 0 12px;color:var(--mut);font-size:16px}.ac small{color:var(--accT);font-weight:600}
.art{max-width:760px;margin:0 auto}.art h2{font-size:30px;margin:44px 0 12px;max-width:none}.art p{font-size:19px;color:#34493f;margin:0 0 6px}
.contact{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:start}.ci{padding:26px}
.ci small{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:16px}.ci small:first-child{margin-top:0}.ci b{font-weight:600}
.soon{text-align:center;padding:30px 0}.soon .mono{color:var(--accT)}
.qcta{margin-top:70px;padding:34px 38px;border-radius:24px;background:var(--dk2);color:#EAF1EB;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.qcta h3{font-size:clamp(22px,3vw,30px);max-width:20em}.qcta .mono{color:var(--acc)}
.cl2{margin-top:96px}
/* calculadora */
.cg{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.3fr);gap:28px;align-items:start}
.cp{padding:30px}.cp.sticky{position:sticky;top:88px}.cp h3{font-size:22px;margin:0 0 4px}.cp .hint{color:var(--mut);font-size:15px;margin:0 0 20px}
.fld{margin-bottom:24px}.fld label{display:block;font-weight:600;margin-bottom:8px}.fld small{display:block;color:var(--mut);font-size:14px;margin-top:6px}
.nin{display:flex;align-items:center;gap:10px;border:1.5px solid #c9d0c3;border-radius:14px;background:#FBF9F4;padding:0 18px;height:62px}
.nin:focus-within{border-color:var(--btn);box-shadow:0 0 0 4px rgba(42,108,88,.2)}.nin span{font-family:var(--mono);color:var(--mut);font-size:15px}
.nin input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:600 28px var(--f)}
.nin.sm{height:50px}.nin.sm input{font-size:20px}
input[type=range]{width:100%;margin:16px 0 0;accent-color:#2A6C58;height:6px}
.tg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tg2 button{text-align:left;border:1.5px solid #c9d0c3;background:#FBF9F4;color:var(--ink);border-radius:14px;padding:14px 16px;cursor:pointer;font:inherit;display:grid;gap:4px}
.tg2 button b{font-weight:700}.tg2 button span{font-size:14px;color:var(--mut)}
.tg2 button[aria-pressed="true"]{border-color:#2A6C58;background:rgba(42,108,88,.1)}.tg2 button[aria-pressed="true"] b{color:#2A6C58}
details.adv{border-top:1px solid var(--ln);padding-top:16px;margin-top:6px}details.adv summary{cursor:pointer;font-weight:600;color:var(--accT);list-style:none}details.adv summary::before{content:"+ "}details.adv[open] summary::before{content:"– "}
details.adv .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}details.adv label{font-size:15px}

@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

@keyframes dn{from{transform:translateY(-100%)}to{transform:none}}
@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}

.card:hover,.q:hover,.hzc:hover,.pri:hover,.pf:hover,.steps li:hover,.strat:hover{transform:translateY(-5px);box-shadow:0 22px 40px -22px rgba(16,36,31,.5)}
.rv.v.card:hover,.rv.v.q:hover,.rv.v.hzc:hover,.rv.v.pri:hover,.rv.v.pf:hover,.rv.v.steps li:hover,.rv.v.strat:hover{transform:translateY(-5px)}

.ac,.pf{overflow:hidden}
.card .n,.steps .n{transition:transform .3s,background .3s}.card:hover .n,.steps li:hover .n{transform:scale(1.15);background:var(--btn);color:#fff}
.hb .t i,.stk i,.bar .t i{transform-origin:left;animation:gx 1.1s .25s cubic-bezier(.2,.7,.2,1) both}
.wzc{animation:pop .5s cubic-bezier(.2,.7,.2,1) both}
